name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        symfony_version: ['6.4.*', '7.0.*', '8.0.*', '8.1.*']
        dependencies: ['highest']
        exclude:
          # Symfony 8 requires PHP 8.4+
          - php: '8.3'
            symfony_version: '8.0.*'
          # Symfony 8.1 requires PHP 8.4.1+
          - php: '8.3'
            symfony_version: '8.1.*'
        include:
          - php: '8.3'
            symfony_version: '6.4.*'
            dependencies: 'lowest'

    name: PHP ${{ matrix.php }} Symfony ${{ matrix.symfony_version }} (${{ matrix.dependencies }})

    services:
      rabbitmq:
        image: rabbitmq:4.0
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672

    steps:
      - uses: actions/checkout@v4

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "::set-output name=dir::$(composer config cache-files-dir)"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.symfony_version }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.symfony_version }}-${{ matrix.dependencies }}-

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: :xdebug

      - run: php ./tests/bin/pin-symfony-version.php "${{ matrix.symfony_version }}"

      - name: Install highest supported dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --no-progress

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-progress --prefer-lowest --prefer-stable

      - name: PHPCS
        run: ./vendor/bin/phpcs

      - name: Psalm
        run: ./vendor/bin/psalm

      - name: Prepare test logs
        run: mkdir -p test-logs

      - name: Artifact name
        id: logs
        run: echo "name=phpunit-logs-php${{ matrix.php }}-sf$(echo '${{ matrix.symfony_version }}' | tr '*' 'x')-${{ matrix.dependencies }}" >> "$GITHUB_OUTPUT"

      - name: PHPUnit
        run: ./vendor/bin/phpunit --log-junit test-logs/junit.xml --testdox-text test-logs/testdox.txt
        env:
          TEST_LOG_DIR: ${{ github.workspace }}/test-logs
          MESSENGER_TRANSPORT_PHPAMQPLIB_DSN: "phpamqplib://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports['5672'] }}/%2f/messages"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.logs.outputs.name }}
          path: test-logs
          if-no-files-found: warn
          retention-days: 14

  chaos:
    name: Live broker chaos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: :xdebug

      - run: composer update --no-progress

      - name: Prepare test logs
        run: mkdir -p test-logs

      # Own compose broker: these tests pause, restart, and stop RabbitMQ.
      # They must not share the PHPUnit service container.
      - name: Start broker
        run: docker compose up -d --wait

      - name: Chaos PHPUnit
        run: ./vendor/bin/phpunit --testsuite chaos --log-junit test-logs/junit.xml --testdox-text test-logs/testdox.txt
        env:
          TEST_LOG_DIR: ${{ github.workspace }}/test-logs

      - name: Collect compose logs
        if: always()
        run: docker compose logs rabbitmq > test-logs/compose-rabbitmq.log 2>&1 || true

      - name: Upload chaos logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-broker-chaos-logs
          path: test-logs
          if-no-files-found: warn
          retention-days: 14

      - if: always()
        run: docker compose down

  infection:
    name: Infection
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      rabbitmq:
        image: rabbitmq:4.0
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672

    steps:
      - uses: actions/checkout@v4

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.4-infection-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-8.4-infection-

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: :xdebug

      - run: composer update --no-progress

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Infection (changed lines)
        if: github.event_name == 'pull_request'
        run: composer infection -- --git-diff-lines --git-diff-base=origin/${{ github.base_ref }} --map-source-class-to-test --no-progress --logger-github=true
        env:
          MESSENGER_TRANSPORT_PHPAMQPLIB_DSN: "phpamqplib://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports['5672'] }}/%2f/messages"

      - name: Infection (full)
        if: github.event_name != 'pull_request'
        run: composer infection -- --no-progress
        env:
          MESSENGER_TRANSPORT_PHPAMQPLIB_DSN: "phpamqplib://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports['5672'] }}/%2f/messages"
